<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Listen & Read | Stance Speak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 35px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #666;
      font-size: 18px;
      margin: 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #888;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .secondary {
      background: #666;
    }

    .danger {
      background: #444;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .settings label {
      margin: 0;
      font-size: 16px;
    }

    select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

    .reading-area {
      font-size: 24px;
      line-height: 1.9;
    }

    .sentence {
      display: inline;
      padding: 4px 6px;
      border-radius: 7px;
      transition: background-color 0.15s;
    }

    .sentence.active {
      background-color: #fff176;
    }

    .instruction {
      color: #666;
      margin-top: 12px;
      font-size: 15px;
    }

    .status {
      margin-top: 15px;
      font-size: 16px;
      color: #555;
      min-height: 22px;
    }

    .recording-status {
      font-weight: bold;
      margin-bottom: 12px;
      min-height: 22px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .back {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #222;
      color: white;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .reading-area {
        font-size: 20px;
      }

      button {
        width: 100%;
      }

      .settings {
        align-items: stretch;
      }

      select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>LISTEN & READ</h1>
      <p class="subtitle">
        Listen to your script and follow along.
      </p>
    </header>


    <!-- SCRIPT -->

    <div class="card">

      <label for="scriptInput">
        YOUR SCRIPT
      </label>

      <textarea
        id="scriptInput"
        placeholder="Paste or type your script here..."
      ></textarea>

      <div class="button-row">

        <button id="saveScriptButton">
          SAVE SCRIPT
        </button>

        <button id="loadScriptButton" class="secondary">
          LOAD SAVED SCRIPT
        </button>

        <button id="downloadScriptButton" class="secondary">
          DOWNLOAD SCRIPT
        </button>

        <button id="clearScriptButton" class="danger">
          CLEAR
        </button>

      </div>

    </div>


    <!-- LISTENING -->

    <div class="card">

      <label>
        LISTEN & READ
      </label>

      <div class="settings">

        <label for="voiceSelect">
          Voice:
        </label>

        <select id="voiceSelect">
          <option value="">
            Loading voices...
          </option>
        </select>

        <label for="speedSelect">
          Speed:
        </label>

        <select id="speedSelect">

          <option value="0.7">0.7×</option>
          <option value="0.8">0.8×</option>
          <option value="0.9" selected>0.9×</option>
          <option value="1">1×</option>
          <option value="1.1">1.1×</option>
          <option value="1.2">1.2×</option>

        </select>

      </div>

      <div class="button-row">

        <button id="playButton">
          ▶ PLAY
        </button>

        <button id="pauseButton">
          ⏸ PAUSE
        </button>

        <button id="stopButton">
          ■ STOP
        </button>

      </div>

      <div id="speechStatus" class="status">
        Paste your script and press PLAY.
      </div>

    </div>


    <!-- READING TEXT -->

    <div class="card">

      <label>
        FOLLOW THE SCRIPT
      </label>

      <div
        id="readingArea"
        class="reading-area"
      >
        Your script will appear here.
      </div>

      <p class="instruction">
        The sentence being spoken will be highlighted.
      </p>

    </div>


    <!-- RECORDING -->

    <div class="card">

      <label>
        RECORD YOURSELF
      </label>

      <p>
        Read your script aloud and listen to your recording.
      </p>

      <div
        id="recordingStatus"
        class="recording-status"
      >
        Ready to record.
      </div>

      <div class="button-row">

        <button id="recordButton">
          🎙 RECORD
        </button>

        <button
          id="stopRecordingButton"
          class="danger"
          disabled
        >
          ■ STOP RECORDING
        </button>

        <button
          id="downloadRecordingButton"
          class="secondary"
          disabled
        >
          ↓ DOWNLOAD RECORDING
        </button>

      </div>

      <audio
        id="audioPlayer"
        controls
        hidden
      ></audio>

    </div>


    <a
      class="back"
      href="index.html"
    >
      ← BACK
    </a>

  </div>


  <script>

    /* =====================================================
       ELEMENTS
       ===================================================== */

    const scriptInput =
      document.getElementById("scriptInput");

    const readingArea =
      document.getElementById("readingArea");

    const voiceSelect =
      document.getElementById("voiceSelect");

    const speedSelect =
      document.getElementById("speedSelect");

    const playButton =
      document.getElementById("playButton");

    const pauseButton =
      document.getElementById("pauseButton");

    const stopButton =
      document.getElementById("stopButton");

    const speechStatus =
      document.getElementById("speechStatus");

    const saveScriptButton =
      document.getElementById("saveScriptButton");

    const loadScriptButton =
      document.getElementById("loadScriptButton");

    const downloadScriptButton =
      document.getElementById("downloadScriptButton");

    const clearScriptButton =
      document.getElementById("clearScriptButton");

    const recordButton =
      document.getElementById("recordButton");

    const stopRecordingButton =
      document.getElementById("stopRecordingButton");

    const downloadRecordingButton =
      document.getElementById("downloadRecordingButton");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const recordingStatus =
      document.getElementById("recordingStatus");


    /* =====================================================
       SPEECH VARIABLES
       ===================================================== */

    let voices = [];

    let sentences = [];

    let currentSentenceIndex = 0;

    let speechStopped = false;


    /* =====================================================
       LOAD VOICES
       ===================================================== */

    function loadVoices() {

      voices =
        window.speechSynthesis.getVoices();

      voiceSelect.innerHTML = "";


      const englishVoices =
        voices.filter(function(voice) {

          return voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith("en");

        });


      const voicesToUse =
        englishVoices.length > 0
          ? englishVoices
          : voices;


      if (voicesToUse.length === 0) {

        const option =
          document.createElement("option");

        option.value = "";

        option.textContent =
          "Default browser voice";

        voiceSelect.appendChild(option);

        return;

      }


      voicesToUse.forEach(function(voice, index) {

        const option =
          document.createElement("option");

        option.value = index;

        option.textContent =
          voice.name +
          " (" +
          voice.lang +
          ")";

        voiceSelect.appendChild(option);

      });

    }


    loadVoices();

    if ("onvoiceschanged" in window.speechSynthesis) {

      window.speechSynthesis.onvoiceschanged =
        loadVoices;

    }


    /* =====================================================
       SPLIT SCRIPT INTO SENTENCES
       ===================================================== */

    function getSentences(text) {

      const cleanedText =
        text
          .replace(/\r\n/g, "\n")
          .trim();


      if (!cleanedText) {
        return [];
      }


      /*
        Split after ., ! or ?
        while preserving the punctuation.
      */

      const matches =
        cleanedText.match(
          /[^.!?]+[.!?]+|[^.!?]+$/g
        );


      if (!matches) {
        return [cleanedText];
      }


      return matches
        .map(function(sentence) {
          return sentence.trim();
        })
        .filter(function(sentence) {
          return sentence.length > 0;
        });

    }


    /* =====================================================
       DISPLAY SCRIPT
       ===================================================== */

    function displayScript(text) {

      readingArea.innerHTML = "";

      sentences =
        getSentences(text);


      if (sentences.length === 0) {

        readingArea.textContent =
          "Your script will appear here.";

        return;

      }


      sentences.forEach(
        function(sentence, index) {

          const span =
            document.createElement("span");

          span.className =
            "sentence";

          span.dataset.index =
            index;

          span.textContent =
            sentence + " ";

          readingArea.appendChild(span);

        }
      );

    }


    /* =====================================================
       HIGHLIGHT
       ===================================================== */

    function highlightSentence(index) {

      const allSentences =
        readingArea.querySelectorAll(
          ".sentence"
        );


      allSentences.forEach(
        function(sentence) {

          sentence.classList.remove(
            "active"
          );

        }
      );


      const current =
        readingArea.querySelector(
          '.sentence[data-index="' +
          index +
          '"]'
        );


      if (current) {

        current.classList.add("active");

        current.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }

    }


    function clearHighlight() {

      const allSentences =
        readingArea.querySelectorAll(
          ".sentence"
        );


      allSentences.forEach(
        function(sentence) {

          sentence.classList.remove(
            "active"
          );

        }
      );

    }


    /* =====================================================
       GET SELECTED VOICE
       ===================================================== */

    function getSelectedVoice() {

      const englishVoices =
        voices.filter(function(voice) {

          return voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith("en");

        });


      const availableVoices =
        englishVoices.length > 0
          ? englishVoices
          : voices;


      const selectedIndex =
        Number(voiceSelect.value);


      return availableVoices[selectedIndex] ||
        null;

    }


    /* =====================================================
       SPEAK CURRENT SENTENCE
       ===================================================== */

    function speakCurrentSentence() {

      if (speechStopped) {
        return;
      }


      if (
        currentSentenceIndex >=
        sentences.length
      ) {

        clearHighlight();

        speechStatus.textContent =
          "Finished.";

        return;

      }


      const sentence =
        sentences[currentSentenceIndex];


      highlightSentence(
        currentSentenceIndex
      );


      speechStatus.textContent =
        "Reading sentence " +
        (currentSentenceIndex + 1) +
        " of " +
        sentences.length +
        "...";


      const utterance =
        new SpeechSynthesisUtterance(
          sentence
        );


      utterance.lang =
        "en-US";


      utterance.rate =
        Number(speedSelect.value);


      const selectedVoice =
        getSelectedVoice();


      if (selectedVoice) {

        utterance.voice =
          selectedVoice;

      }


      utterance.onend =
        function() {

          if (speechStopped) {
            return;
          }


          currentSentenceIndex++;


          /*
            Small delay between sentences.
            This makes the highlighting easier
            for students to follow.
          */

          setTimeout(
            function() {

              speakCurrentSentence();

            },
            100
          );

        };


      utterance.onerror =
        function(event) {

          if (speechStopped) {
            return;
          }


          /*
            "canceled" can happen normally when
            STOP is pressed, so don't show an
            error in that situation.
          */

          if (
            event.error === "canceled"
          ) {
            return;
          }


          speechStatus.textContent =
            "The browser could not read the text.";

        };


      window.speechSynthesis.speak(
        utterance
      );

    }


    /* =====================================================
       PLAY / RESUME
       ===================================================== */

    playButton.addEventListener(
      "click",
      function() {

        const text =
          scriptInput.value.trim();


        if (!text) {

          speechStatus.textContent =
            "Please paste your script first.";

          return;

        }


        /*
          If speech is paused, PLAY resumes it.
        */

        if (
          window.speechSynthesis.paused
        ) {

          window.speechSynthesis.resume();

          speechStatus.textContent =
            "Reading...";

          return;

        }


        /*
          Otherwise start from the beginning.
        */

        window.speechSynthesis.cancel();

        speechStopped = false;

        currentSentenceIndex = 0;

        displayScript(text);

        speakCurrentSentence();

      }
    );


    /* =====================================================
       PAUSE
       ===================================================== */

    pauseButton.addEventListener(
      "click",
      function() {

        if (
          window.speechSynthesis.speaking &&
          !window.speechSynthesis.paused
        ) {

          window.speechSynthesis.pause();

          speechStatus.textContent =
            "Paused.";

        }

      }
    );


    /* =====================================================
       STOP
       ===================================================== */

    stopButton.addEventListener(
      "click",
      function() {

        speechStopped = true;

        window.speechSynthesis.cancel();

        clearHighlight();

        speechStatus.textContent =
          "Stopped.";

      }
    );


    /* =====================================================
       UPDATE SCRIPT DISPLAY
       ===================================================== */

    scriptInput.addEventListener(
      "input",
      function() {

        /*
          Stop speech if the script changes.
        */

        speechStopped = true;

        window.speechSynthesis.cancel();

        displayScript(
          scriptInput.value
        );

        speechStatus.textContent =
          "Script changed. Press PLAY.";

      }
    );


    /* =====================================================
       VOICE CHANGE
       ===================================================== */

    voiceSelect.addEventListener(
      "change",
      function() {

        if (
          window.speechSynthesis.speaking ||
          window.speechSynthesis.paused
        ) {

          speechStopped = true;

          window.speechSynthesis.cancel();

          clearHighlight();

          speechStatus.textContent =
            "Voice changed. Press PLAY.";

        }

      }
    );


    /* =====================================================
       SPEED CHANGE
       ===================================================== */

    speedSelect.addEventListener(
      "change",
      function() {

        if (
          window.speechSynthesis.speaking ||
          window.speechSynthesis.paused
        ) {

          speechStopped = true;

          window.speechSynthesis.cancel();

          clearHighlight();

          speechStatus.textContent =
            "Speed changed. Press PLAY.";

        }

      }
    );


    /* =====================================================
       SAVE SCRIPT
       ===================================================== */

    saveScriptButton.addEventListener(
      "click",
      function() {

        const text =
          scriptInput.value.trim();


        if (!text) {

          speechStatus.textContent =
            "There is no script to save.";

          return;

        }


        localStorage.setItem(
          "stanceSpeakScript",
          text
        );


        speechStatus.textContent =
          "Script saved on this device.";

      }
    );


    /* =====================================================
       LOAD SCRIPT
       ===================================================== */

    loadScriptButton.addEventListener(
      "click",
      function() {

        const savedScript =
          localStorage.getItem(
            "stanceSpeakScript"
          );


        if (!savedScript) {

          speechStatus.textContent =
            "No saved script was found on this device.";

          return;

        }


        speechStopped = true;

        window.speechSynthesis.cancel();

        scriptInput.value =
          savedScript;

        displayScript(
          savedScript
        );


        speechStatus.textContent =
          "Saved script loaded.";

      }
    );


    /* =====================================================
       DOWNLOAD SCRIPT
       ===================================================== */

    downloadScriptButton.addEventListener(
      "click",
      function() {

        const text =
          scriptInput.value.trim();


        if (!text) {

          speechStatus.textContent =
            "There is no script to download.";

          return;

        }


        const blob =
          new Blob(
            [text],
            {
              type: "text/plain;charset=utf-8"
            }
          );


        const url =
          URL.createObjectURL(blob);


        const link =
          document.createElement("a");


        link.href =
          url;

        link.download =
          "stance-speak-script.txt";


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        URL.revokeObjectURL(url);

      }
    );


    /* =====================================================
       CLEAR SCRIPT
       ===================================================== */

    clearScriptButton.addEventListener(
      "click",
      function() {

        speechStopped = true;

        window.speechSynthesis.cancel();

        scriptInput.value = "";

        displayScript("");

        clearHighlight();

        speechStatus.textContent =
          "Script cleared.";

      }
    );


    /* =====================================================
       RECORDING
       ===================================================== */

    let mediaRecorder = null;

    let recordedChunks = [];

    let recordingStream = null;

    let recordingBlob = null;


    /* =====================================================
       RECORD
       ===================================================== */

    recordButton.addEventListener(
      "click",
      async function() {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          recordingStatus.textContent =
            "Microphone recording is not supported in this browser.";

          return;

        }


        if (
          typeof MediaRecorder ===
          "undefined"
        ) {

          recordingStatus.textContent =
            "Audio recording is not supported in this browser.";

          return;

        }


        try {

          recordingStream =
            await navigator.mediaDevices.getUserMedia(
              {
                audio: true
              }
            );


          recordedChunks = [];

          recordingBlob = null;


          /*
            Find a format supported by the
            current browser.
          */

          let mimeType = "";


          const possibleTypes = [

            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/mp4",
            "audio/ogg;codecs=opus"

          ];


          for (
            let i = 0;
            i < possibleTypes.length;
            i++
          ) {

            if (
              MediaRecorder.isTypeSupported(
                possibleTypes[i]
              )
            ) {

              mimeType =
                possibleTypes[i];

              break;

            }

          }


          if (mimeType) {

            mediaRecorder =
              new MediaRecorder(
                recordingStream,
                {
                  mimeType:
                    mimeType
                }
              );

          } else {

            mediaRecorder =
              new MediaRecorder(
                recordingStream
              );

          }


          mediaRecorder.ondataavailable =
            function(event) {

              if (
                event.data &&
                event.data.size > 0
              ) {

                recordedChunks.push(
                  event.data
                );

              }

            };


          mediaRecorder.onstop =
            function() {

              const actualType =
                mediaRecorder.mimeType ||
                "audio/webm";


              recordingBlob =
                new Blob(
                  recordedChunks,
                  {
                    type: actualType
                  }
                );


              const audioURL =
                URL.createObjectURL(
                  recordingBlob
                );


              audioPlayer.src =
                audioURL;

              audioPlayer.hidden =
                false;


              downloadRecordingButton.disabled =
                false;


              recordingStatus.textContent =
                "Recording ready. You can play or download it.";


              if (recordingStream) {

                recordingStream
                  .getTracks()
                  .forEach(
                    function(track) {

                      track.stop();

                    }
                  );

              }

            };


          mediaRecorder.onerror =
            function() {

              recordingStatus.textContent =
                "There was a problem recording the audio.";

              recordButton.disabled =
                false;

              stopRecordingButton.disabled =
                true;

            };


          mediaRecorder.start();


          recordButton.disabled =
            true;

          stopRecordingButton.disabled =
            false;

          downloadRecordingButton.disabled =
            true;


          audioPlayer.hidden =
            true;


          recordingStatus.textContent =
            "🔴 Recording...";


        } catch (error) {

          recordingStatus.textContent =
            "Microphone permission was not granted.";

          recordButton.disabled =
            false;

          stopRecordingButton.disabled =
            true;

        }

      }
    );


    /* =====================================================
       STOP RECORDING
       ===================================================== */

    stopRecordingButton.addEventListener(
      "click",
      function() {

        if (
          mediaRecorder &&
          mediaRecorder.state !==
          "inactive"
        ) {

          mediaRecorder.stop();

        }


        recordButton.disabled =
          false;

        stopRecordingButton.disabled =
          true;

      }
    );


    /* =====================================================
       DOWNLOAD RECORDING
       ===================================================== */

    downloadRecordingButton.addEventListener(
      "click",
      function() {

        if (!recordingBlob) {

          return;

        }


        const url =
          URL.createObjectURL(
            recordingBlob
          );


        const extension =
          recordingBlob.type.includes("mp4")
            ? "mp4"
            : recordingBlob.type.includes("ogg")
              ? "ogg"
              : "webm";


        const link =
          document.createElement("a");


        link.href =
          url;

        link.download =
          "stance-speak-recording." +
          extension;


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        URL.revokeObjectURL(url);

      }
    );


    /* =====================================================
       INITIAL STATE
       ===================================================== */

    displayScript("");

  </script>

</body>
</html>
