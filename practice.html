<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Practice Your Script | Stance Speak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px 20px 60px;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 25px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #222;
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    .back-home:hover {
      opacity: 0.8;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 38px;
    }

    .subtitle {
      margin: 0;
      color: #666;
      font-size: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      min-height: 230px;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #777;
    }

    button {
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 16px;
      padding: 11px 18px;
      border-radius: 8px;
    }

    button:hover {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .secondary {
      background: #666;
    }

    .level4-order-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .level4-order-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: #fff;
      cursor: grab;
      user-select: none;
    }

    .level4-order-item:active {
      cursor: grabbing;
    }

    .level4-order-item.dragging {
      opacity: 0.5;
    }

    .level4-number {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 700;
      background: #eee;
    }

    .level4-sentence {
      flex: 1;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .saved-message {
      margin-top: 12px;
      color: #555;
      font-size: 15px;
    }

    #practiceArea {
      display: none;
    }

    .level-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .instructions {
      margin: 0 0 25px;
      color: #666;
      line-height: 1.5;
    }

    .question {
      padding: 20px;
      margin-bottom: 16px;
      border: 2px solid #e2e2e2;
      border-radius: 12px;
    }

    .question-number {
      font-weight: bold;
      margin-bottom: 12px;
      color: #555;
    }

    .sentence {
      font-size: 21px;
      line-height: 1.8;
      margin-bottom: 18px;
    }

    .blank {
      display: inline-block;
      min-width: 100px;
      border-bottom: 3px solid #222;
      text-align: center;
      font-weight: bold;
      margin: 0 4px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .choice {
      background: white;
      color: #222;
      border: 2px solid #ccc;
      text-align: left;
    }

    .choice:hover {
      background: #f2f2f2;
    }

    .choice.correct {
      border-color: #222;
      background: #e8e8e8;
    }

    .choice.incorrect {
      border-color: #999;
      background: #f1f1f1;
    }

    .choice:disabled {
      opacity: 1;
      cursor: default;
    }

    .feedback {
      margin-top: 12px;
      font-weight: bold;
      min-height: 20px;
    }

    .progress-box {
      background: #f1f1f1;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .script-preview {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
    }

    .hidden {
      display: none !important;
    }

    .level-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
    }

    .level-tab {
      background: white;
      color: #222;
      border: 2px solid #ccc;
      padding: 9px 14px;
    }

    .level-tab.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .level-tab.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .level-status {
      font-size: 14px;
      font-weight: normal;
      display: block;
      margin-top: 3px;
    }

    .answer-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 18px;
      font-family: Arial, sans-serif;
      margin-top: 10px;
    }

    .answer-input:focus {
      outline: none;
      border-color: #777;
    }

    .answer-input.correct {
      border-color: #222;
      background: #e8e8e8;
    }

    .answer-input.incorrect {
      border-color: #999;
      background: #f1f1f1;
    }

    .reconstruct {
      width: 100%;
      min-height: 120px;
      margin-top: 10px;
    }

    .completion-box {
      padding: 22px;
      border: 2px solid #222;
      border-radius: 12px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    .completion-box h3 {
      margin-top: 0;
    }

    .small-note {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      h1 {
        font-size: 30px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .sentence {
        font-size: 19px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="index.html" class="back-home">
      ← BACK TO HOME
    </a>

    <header>
      <h1>PRACTICE YOUR SCRIPT</h1>
      <p class="subtitle">
        Practice your script step by step and build your memory.
      </p>
    </header>

    <!-- SCRIPT INPUT -->

    <div class="card" id="scriptCard">

      <label for="scriptInput">
        PASTE YOUR SCRIPT
      </label>

      <textarea
        id="scriptInput"
        placeholder="Paste your script here..."
      ></textarea>

      <div class="button-row">

        <button id="generateButton" type="button">
          GENERATE PRACTICE
        </button>

      </div>

      <div
        id="savedMessage"
        class="saved-message"
      ></div>

    </div>


    <!-- PRACTICE -->

    <div class="card" id="practiceArea">

      <div id="levelNav" class="level-nav"></div>

      <h2 id="levelTitle" class="level-title"></h2>

      <p id="levelInstructions" class="instructions"></p>

      <div
        id="progressBox"
        class="progress-box"
      ></div>

      <div id="questions"></div>

      <div
        id="completionBox"
        class="completion-box hidden"
      ></div>

      <div class="button-row">

        <button
          id="nextLevelButton"
          type="button"
          class="hidden"
        >
          NEXT LEVEL
        </button>

        <button
          id="tryAgainButton"
          type="button"
          class="hidden"
        >
          TRY ANOTHER PART
        </button>

      </div>

    </div>


    <!-- SCRIPT PREVIEW -->

    <div
      class="card hidden"
      id="scriptPreviewCard"
    >

      <h2>Your Script</h2>

      <div
        id="scriptPreview"
        class="script-preview"
      ></div>

    </div>

  </div>


  <script>

    /*
      =====================================================
      PRACTICE YOUR SCRIPT — LEVELS 1–4
      =====================================================

      Everything runs in the browser.

      No external libraries.
      No paid services.
      No API.
      No database.

      Progress is stored locally on this device.

      IMPORTANT:
      listen.html is intentionally not used or modified.
    */


    const LEVELS = {

      1: {
        title: "LEVEL 1 — FILL IN THE BLANKS",
        instructions:
          "Choose the word that belongs in each blank. Read the complete sentence after answering."
      },

      2: {
        title: "LEVEL 2 — GUIDED RECALL",
        instructions:
          "Choose the missing words. There are more blanks and less support than in Level 1."
      },

      3: {
        title: "LEVEL 3 — REDUCED SUPPORT",
        instructions:
          "Type the missing words. Think carefully and use the script as your reference if needed."
      },

      4: {
        title: "LEVEL 4 — INDEPENDENT PRACTICE",
        instructions:
          "Rebuild each sentence from memory. Type the complete sentence."
      }

    };


    const scriptInput =
      document.getElementById("scriptInput");

    const generateButton =
      document.getElementById("generateButton");

    const savedMessage =
      document.getElementById("savedMessage");

    const practiceArea =
      document.getElementById("practiceArea");

    const questionsContainer =
      document.getElementById("questions");

    const progressBox =
      document.getElementById("progressBox");

    const nextLevelButton =
      document.getElementById("nextLevelButton");


    const tryAgainButton =
      document.getElementById("tryAgainButton");

    const scriptPreviewCard =
      document.getElementById("scriptPreviewCard");

    const scriptPreview =
      document.getElementById("scriptPreview");

    const levelNav =
      document.getElementById("levelNav");

    const levelTitle =
      document.getElementById("levelTitle");

    const levelInstructions =
      document.getElementById("levelInstructions");

    const completionBox =
      document.getElementById("completionBox");


    let currentPractice = null;


    /*
      =====================================================
      UTILITY FUNCTIONS
      =====================================================
    */


    function shuffle(array) {

      const copy =
        array.slice();

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        const temporary =
          copy[i];

        copy[i] =
          copy[j];

        copy[j] =
          temporary;

      }

      return copy;

    }


    function normalizeWord(word) {

      return word
        .replace(
          /^[^A-Za-z0-9'’-]+/,
          ""
        )
        .replace(
          /[^A-Za-z0-9'’-]+$/,
          ""
        );

    }


    function getWords(text) {

      return text
        .split(/\s+/)
        .map(normalizeWord)
        .filter(Boolean);

    }


    function normalizeAnswer(answer) {

      return normalizeWord(
        String(answer || "").trim()
      ).toLowerCase();

    }


    function normalizeSentence(text) {

      return String(text || "")
        .trim()
        .replace(/\s+/g, " ")
        .replace(/[.!?]+$/g, "")
        .toLowerCase();

    }


    /*
      =====================================================
      CHOOSING WORDS TO REMOVE
      =====================================================
    */


    function isGoodBlankWord(word) {

      const clean =
        normalizeWord(word);

      const lower =
        clean.toLowerCase();

      const commonShortWords = [

        "a",
        "an",
        "the",
        "i",
        "am",
        "is",
        "are",
        "in",
        "on",
        "at",
        "to",
        "of",
        "and",
        "or",
        "my",
        "we",
        "they",
        "he",
        "she",
        "it"

      ];


      if (
        clean.length < 3
      ) {

        return false;

      }


      if (
        commonShortWords.includes(lower)
      ) {

        return false;

      }


      return true;

    }


    /*
      =====================================================
      SPLIT SCRIPT INTO SENTENCES
      =====================================================
    */


    function getSentences(script) {

      const lines =
        script
          .replace(/\r\n/g, "\n")
          .split("\n");


      const sentences = [];


      lines.forEach(
        function(line, lineIndex) {

          const trimmed =
            line.trim();


          if (!trimmed) {
            return;
          }


          /*
            Preserve each meaningful line as a unit.

            This is important for podcast scripts,
            where one student may paste several separate
            lines that should be practiced independently.
          */

          const tokens =
            trimmed
              .split(/\s+/)
              .filter(Boolean);


          if (
            tokens.length >= 3
          ) {

            sentences.push({
              sentence: trimmed,
              tokens: tokens,
              originalIndex: lineIndex
            });

          }

        }
      );


      return sentences;

    }


    /*
      =====================================================
      SELECT PRACTICE SET
      =====================================================
    */

    function selectPracticeSet(sentences) {

      if (
        !sentences ||
        sentences.length === 0
      ) {

        return [];

      }


      const total =
        sentences.length;


      const count =
        Math.min(
          6,
          total
        );


      return sentences.slice(
        0,
        count
      );

    }



    /*
      =====================================================
      CREATE LEVEL 1
      =====================================================
    */


    function createLevel1(sentences, script) {

      const questions = [];


      sentences.forEach(
        function(item) {

          const candidates =
            item.tokens
              .map(
                function(token, index) {

                  return {
                    token: token,
                    index: index,
                    clean: normalizeWord(token)
                  };

                }
              )
              .filter(
                function(candidate) {

                  return isGoodBlankWord(
                    candidate.clean
                  );

                }
              );


          if (
            candidates.length === 0
          ) {
            return;
          }


          const chosen =
            candidates[
              Math.floor(
                Math.random() *
                candidates.length
              )
            ];


          const correct =
            chosen.clean;


          const possibleDistractors =
            getWords(script)
              .filter(
                function(word) {

                  const clean =
                    normalizeWord(word);

                  return (
                    clean &&
                    clean.toLowerCase() !==
                      correct.toLowerCase() &&
                    clean.length >= 3
                  );

                }
              );


          const uniqueDistractors = [];


          possibleDistractors.forEach(
            function(word) {

              const clean =
                normalizeWord(word);


              const alreadyUsed =
                uniqueDistractors.some(
                  function(existing) {

                    return (
                      existing.toLowerCase() ===
                      clean.toLowerCase()
                    );

                  }
                );


              if (
                !alreadyUsed &&
                clean.toLowerCase() !==
                  correct.toLowerCase()
              ) {

                uniqueDistractors.push(
                  clean
                );

              }

            }
          );


          const distractors =
            shuffle(
              uniqueDistractors
            ).slice(0, 2);


          const fallbackWords = [

            "COUNTRY",
            "PEOPLE",
            "TRADITIONAL",
            "FAMILY",
            "SCHOOL"

          ];


          for (
            let i = distractors.length;
            i < 2;
            i++
          ) {

            const fallback =
              fallbackWords[i];


            if (
              fallback &&
              fallback.toLowerCase() !==
                correct.toLowerCase() &&
              !distractors.some(
                function(item) {

                  return (
                    item.toLowerCase() ===
                    fallback.toLowerCase()
                  );

                }
              )
            ) {

              distractors.push(
                fallback
              );

            }

          }


          questions.push({

            originalSentence:
              item.sentence,

            tokens:
              item.tokens,

            blankIndexes:
              [chosen.index],

            correctWords:
              [correct],

            choices:
              shuffle([
                correct,
                distractors[0],
                distractors[1]
              ]),

            answers:
              [null],

            answered:
              false,

            correctAnswer:
              false,

            lastAttemptCorrect:
              null

          });

        }
      );


      return questions;

    }


    /*
      =====================================================
      CREATE LEVEL 2
      =====================================================
    */


    function createLevel2(sentences) {

      const questions = [];


      sentences.forEach(
        function(item) {

          const candidates =
            item.tokens
              .map(
                function(token, index) {

                  return {
                    token: token,
                    index: index,
                    clean: normalizeWord(token)
                  };

                }
              )
              .filter(
                function(candidate) {

                  return isGoodBlankWord(
                    candidate.clean
                  );

                }
              );


          if (
            candidates.length < 2
          ) {
            return;
          }


          const selectedCandidates =
            shuffle(candidates)
              .slice(
                0,
                Math.min(2, candidates.length)
              );


          const blankIndexes =
            selectedCandidates
              .map(
                function(candidate) {
                  return candidate.index;
                }
              )
              .sort(
                function(a, b) {
                  return a - b;
                }
              );


          const correctWords =
            blankIndexes.map(
              function(index) {

                return normalizeWord(
                  item.tokens[index]
                );

              }
            );


          const allWords =
            getWords(
              sentences
                .map(function(sentenceItem) {
                  return sentenceItem.sentence;
                })
                .join(" ")
            );


          const distractors = [];


          shuffle(allWords).forEach(
            function(word) {

              const clean =
                normalizeWord(word);


              if (!clean) {
                return;
              }


              const isCorrect =
                correctWords.some(
                  function(correct) {

                    return (
                      normalizeAnswer(correct) ===
                      normalizeAnswer(clean)
                    );

                  }
                );


              const alreadyUsed =
                distractors.some(
                  function(existing) {

                    return (
                      normalizeAnswer(existing) ===
                      normalizeAnswer(clean)
                    );

                  }
                );


              if (
                !isCorrect &&
                !alreadyUsed &&
                distractors.length < 2
              ) {

                distractors.push(clean);

              }

            }
          );


          const choices =
            shuffle(
              correctWords.concat(
                distractors
              )
            );


          questions.push({

            originalSentence:
              item.sentence,

            tokens:
              item.tokens,

            blankIndexes:
              blankIndexes,

            correctWords:
              correctWords,

            choices:
              choices,

            answers:
              correctWords.map(function() {
                return null;
              }),

            answered:
              false,

            correctAnswer:
              false,

            lastAttemptCorrect:
              null

          });

        }
      );


      return questions;

    }


    /*
      =====================================================
      CREATE LEVEL 3
      =====================================================
    */


    function createLevel3(sentences) {

      const questions = [];


      sentences.forEach(
        function(item) {

          const candidates =
            item.tokens
              .map(
                function(token, index) {

                  return {
                    token: token,
                    index: index,
                    clean: normalizeWord(token)
                  };

                }
              )
              .filter(
                function(candidate) {

                  return isGoodBlankWord(
                    candidate.clean
                  );

                }
              );


          if (
            candidates.length === 0
          ) {
            return;
          }


          const numberOfBlanks =
            Math.min(
              3,
              Math.max(
                1,
                Math.ceil(
                  candidates.length / 2
                )
              )
            );


          const selectedCandidates =
            shuffle(candidates)
              .slice(
                0,
                numberOfBlanks
              );


          const blankIndexes =
            selectedCandidates
              .map(
                function(candidate) {
                  return candidate.index;
                }
              )
              .sort(
                function(a, b) {
                  return a - b;
                }
              );


          const correctWords =
            blankIndexes.map(
              function(index) {

                return normalizeWord(
                  item.tokens[index]
                );

              }
            );


          questions.push({

            originalSentence:
              item.sentence,

            tokens:
              item.tokens,

            blankIndexes:
              blankIndexes,

            correctWords:
              correctWords,

            answers:
              correctWords.map(function() {
                return "";
              }),

            answered:
              false,

            correctAnswer:
              false,

            lastAttemptCorrect:
              null

          });

        }
      );


      return questions;

    }


    /*
      =====================================================
      CREATE LEVEL 4
      =====================================================
    */


    function createLevel4(sentences) {

      if (
        !sentences ||
        sentences.length === 0
      ) {

        return [];

      }


      const items =
        sentences.map(
          function(item, index) {

            return {
              id:
                "level4-" +
                index +
                "-" +
                Date.now() +
                "-" +
                Math.random()
                  .toString(36)
                  .slice(2),

              sentence:
                item.sentence,

              originalIndex:
                item.originalIndex
            };

          }
        );


      const shuffled =
        shuffle(
          items.slice()
        );


      return [
        {
          type:
            "ordering",

          items:
            items,

          shuffledItems:
            shuffled,

          currentOrder:
            shuffled.map(
              function(item) {
                return item.id;
              }
            ),

          answer:
            [],

          answered:
            false,

          correctAnswer:
            false,

          lastAttemptCorrect:
            null
        }
      ];

    }



    /*
      =====================================================
      CREATE COMPLETE PRACTICE
      =====================================================
    */


    function createPractice(script) {

      const sentences =
        getSentences(script);


      if (
        sentences.length === 0
      ) {

        return null;

      }


      const practiceSet =
        selectPracticeSet(
          sentences
        );


      if (
        practiceSet.length === 0
      ) {

        return null;

      }


      const level1 =
        createLevel1(
          practiceSet,
          script
        );


      const level2 =
        createLevel2(
          practiceSet
        );


      const level3 =
        createLevel3(
          practiceSet
        );


      const level4 =
        createLevel4(
          practiceSet
        );


      if (
        level1.length === 0 ||
        level2.length === 0 ||
        level3.length === 0 ||
        level4.length === 0
      ) {

        return null;

      }


      return {

        version: 2,

        script:
          script,

        levels: {

          1: level1,
          2: level2,
          3: level3,
          4: level4

        },

        currentLevel:
          1,

        unlockedLevel:
          1,

        completedLevels: [],

        createdAt:
          new Date().toISOString(),

        updatedAt:
          new Date().toISOString()

      };

    }


    /*
      =====================================================
      TRY AGAIN WITH A NEW PART OF THE SCRIPT
      =====================================================
    */

    function tryAgainWithNewPracticeSet() {

      if (
        !currentPractice ||
        !currentPractice.script
      ) {

        return;

      }


      tryAgainButton.classList.add(
        "hidden"
      );



      const sentences =
        getSentences(
          currentPractice.script
        );


      const practiceSet =
        selectPracticeSet(
          sentences
        );


      if (
        practiceSet.length === 0
      ) {

        return;

      }

        );

        new Date().toISOString();

    /*
      =====================================================
      LEVEL COMPLETION
      =====================================================
    */


    function isLevelComplete(level) {

      if (
        !currentPractice ||
        !currentPractice.levels[level]
      ) {

        return false;

      }


      const questions =
        currentPractice.levels[level];


      if (
        questions.length === 0
      ) {

        return false;

      }


      return questions.every(
        function(question) {

          return (
            question.answered &&
            question.correctAnswer
          );

        }
      );

    }


    function updateUnlockedLevel() {

      if (!currentPractice) {
        return;
      }


      for (
        let level = 1;
        level <= 4;
        level++
      ) {

        if (
          isLevelComplete(level)
        ) {

          if (
            !currentPractice.completedLevels.includes(
              level
            )
          ) {

            currentPractice.completedLevels.push(
              level
            );

          }


          if (
            level < 4
          ) {

            currentPractice.unlockedLevel =
              Math.max(
                currentPractice.unlockedLevel,
                level + 1
              );

          }

        }

      }


      if (
        currentPractice.unlockedLevel > 4
      ) {

        currentPractice.unlockedLevel =
          4;

      }

    }

    function renderLevelNavigation() {

      levelNav.innerHTML =
        "";


      for (

        level <= 4;
        level++
      ) {

          document.createElement("button");


        button.type =
          "button";


        button.className =
          "level-tab";


                const unlocked =
          true;


        const completed =
          currentPractice.completedLevels.includes(
            level
          );


        if (
          level ===
          currentPractice.currentLevel
        ) {

          button.classList.add(
            "active"
          );

        }


        if (!unlocked) {

          button.classList.add(
            "locked"
          );

          button.disabled =
            true;

        }


        let status =
          "LOCKED";


        if (completed) {

          status =
            "✓ COMPLETE";

        } else if (unlocked) {

          status =
            level ===
            currentPractice.currentLevel
              ? "CURRENT"
              : "UNLOCKED";

        }


        button.innerHTML =
          "LEVEL " +
          level +
          '<span class="level-status">' +
          status +
          "</span>";


        if (unlocked) {

          button.addEventListener(
            "click",
            function() {

                            currentPractice.currentLevel =
                level;

              renderPractice();

            }
          );

        }


        levelNav.appendChild(
          button
        );

      }

    }

    /*

      =====================================================
    */


    function renderLevel1(
      questions
    ) {

      questions.forEach(
        function(question, questionIndex) {

          const card =
            createQuestionCard(
              questionIndex
            );


          const sentence =
            document.createElement("div");


          sentence.className =
            "sentence";


          question.tokens.forEach(
            function(token, tokenIndex) {

              if (
                question.blankIndexes.includes(
                  tokenIndex
                )
              ) {

                const blank =
                  document.createElement("span");


                blank.className =
                  "blank";


                const blankPosition =
                  question.blankIndexes.indexOf(
                    tokenIndex
                  );


                blank.textContent =
                  question.answers[
                    blankPosition
                  ] ||
                  "________";


                sentence.appendChild(
                  blank
                );

              } else {

                sentence.appendChild(
                  document.createTextNode(
                    token
                  )
                );

              }


              sentence.appendChild(
                document.createTextNode(
                  " "
                )
              );

            }
          );


          card.appendChild(
            sentence
          );


          const choices =
            document.createElement("div");


          choices.className =
            "choices";


          question.choices.forEach(
            function(choice) {

              const button =
                document.createElement("button");


              button.type =
                "button";


              button.className =
                "choice";


              button.textContent =
                choice;


              if (
                question.answered
              ) {

                button.disabled =
                  true;


                if (
                  normalizeAnswer(choice) ===
                  normalizeAnswer(
                    question.correctWords[0]
                  )
                ) {

                  button.classList.add(
                    "correct"
                  );

                }

              }


              if (
                question.lastAttemptCorrect ===
                  false &&
                question.answers[0] &&
                normalizeAnswer(choice) ===
                  normalizeAnswer(
                    question.answers[0]
                  )
              ) {

                button.classList.add(
                  "incorrect"
                );

              }


              button.addEventListener(
                "click",
                function() {

                  answerLevel1Question(
                    questionIndex,
                    choice
                  );

                }
              );


              choices.appendChild(
                button
              );

            }
          );


          card.appendChild(
            choices
          );


          const feedback =
            document.createElement("div");


          feedback.className =
            "feedback";


          if (
            question.correctAnswer
          ) {

            feedback.textContent =
              "✓ CORRECT";

          } else if (
            question.lastAttemptCorrect ===
              false
          ) {

            feedback.textContent =
              "✗ NOT QUITE. Try again.";

          }


          card.appendChild(
            feedback
          );


          questionsContainer.appendChild(
            card
          );

        }
      );

    }


    function answerLevel1Question(
      questionIndex,
      selected
    ) {

      const question =
        currentPractice.levels[1][
          questionIndex
        ];


      if (
        question.answered
      ) {

        return;

      }


      question.answers[0] =
        selected;


      const correct =
        normalizeAnswer(selected) ===
        normalizeAnswer(
          question.correctWords[0]
        );


      question.lastAttemptCorrect =
        correct;

      question.correctAnswer =
        correct;

      question.answered =
        correct;


      updateUnlockedLevel();

      renderPractice();

    }

    function answerLevel2Question(
      questionIndex,
      selected
    ) {

      const question =
        currentPractice.levels[2][
          questionIndex
        ];


      if (
        question.answered
      ) {

        return;

      }


      const nextBlank =
        question.answers.findIndex(
          function(answer) {

            return answer === null;

          }
        );


      if (
        nextBlank === -1
      ) {

        return;

      }


      question.answers[
        nextBlank
      ] =
        selected;


      if (
        question.answers.every(
          function(answer) {

            return answer !== null;

          }
        )
      ) {

        const isCorrect =
          question.answers.every(
            function(answer, index) {

              return (
                normalizeAnswer(answer) ===
                normalizeAnswer(
                  question.correctWords[index]
                )
              );

            }
          );


        question.lastAttemptCorrect =
          isCorrect;

        question.correctAnswer =
          isCorrect;

        question.answered =
          isCorrect;


        if (
          !isCorrect
        ) {

          question.answers =
            question.answers.map(
              function() {

                return null;

              }
            );

        }


        updateUnlockedLevel();

        }


      renderPractice();

    }

    function checkLevel3Question(

    /*
      =====================================================
      LEVEL 4 RENDERING
      =====================================================
    */


    function renderLevel4(
      questions
    ) {

      questions.forEach(
        function(question, questionIndex) {

          const card =
            createQuestionCard(
              questionIndex
            );


          const prompt =
            document.createElement("div");


          prompt.className =
            "small-note";


          prompt.textContent =
            "THESE PARTS OF YOUR SCRIPT ARE SCRAMBLED. DRAG THEM INTO THE CORRECT ORDER.";


          card.appendChild(
            prompt
          );


          const list =
            document.createElement("div");


          list.className =
            "level4-order-list";


          let draggedItem =
            null;


          question.currentOrder =
            question.currentOrder ||
            question.shuffledItems.map(
              function(item) {
                return item.id;
              }
            );


          function renderOrder() {

            list.innerHTML =
              "";


            question.currentOrder.forEach(
              function(itemId, position) {

                const item =
                  question.shuffledItems.find(
                    function(entry) {
                      return entry.id === itemId;
                    }
                  );


                if (!item) {
                  return;
                }


                const row =
                  document.createElement("div");


                row.className =
                  "level4-order-item";


                row.draggable =
                  !question.answered;


                row.dataset.id =
                  item.id;


                const number =
                  document.createElement("span");


                number.className =
                  "level4-number";


                number.textContent =
                  String(position + 1);


                const sentence =
                  document.createElement("span");


                sentence.className =
                  "level4-sentence";


                sentence.textContent =
                  item.sentence;


                row.appendChild(
                  number
                );


                row.appendChild(
                  sentence
                );


                if (
                  !question.answered
                ) {

                  row.addEventListener(
                    "dragstart",
                    function() {

                      draggedItem =
                        item.id;

                      row.classList.add(
                        "dragging"
                      );

                    }
                  );


                  row.addEventListener(
                    "dragend",
                    function() {

                      draggedItem =
                        null;

                      row.classList.remove(
                        "dragging"
                      );

                    }
                  );


                  row.addEventListener(
                    "dragover",
                    function(event) {

                      event.preventDefault();

                    }
                  );


                  row.addEventListener(
                    "drop",
                    function(event) {

                      event.preventDefault();


                      if (
                        !draggedItem ||
                        draggedItem ===
                          item.id
                      ) {

                        return;

                      }


                      const fromIndex =
                        question.currentOrder.indexOf(
                          draggedItem
                        );


                      const toIndex =
                        question.currentOrder.indexOf(
                          item.id
                        );


                      if (
                        fromIndex === -1 ||
                        toIndex === -1
                      ) {

                        return;

                      }


                      question.currentOrder.splice(
                        fromIndex,
                        1
                      );


                      question.currentOrder.splice(
                        toIndex,
                        0,
                        draggedItem
                      );


                      renderOrder();

                    }
                  );

                }


                list.appendChild(
                  row
                );

              }
            );

          }


          renderOrder();


          card.appendChild(
            list
          );


          if (
            !question.answered
          ) {

            const checkButton =
              document.createElement("button");


            checkButton.type =
              "button";


            checkButton.textContent =
              "CHECK ORDER";


            checkButton.addEventListener(
              "click",
              function() {

                checkLevel4Question(
                  questionIndex
                );

              }
            );


            card.appendChild(
              checkButton
            );

          }


          const feedback =
            document.createElement("div");


          feedback.className =
            "feedback";


          if (
            question.lastAttemptCorrect ===
              true
          ) {

            feedback.textContent =
              "✓ GREAT JOB! TRY AGAIN TO PRACTICE A NEW PART OF YOUR SCRIPT!";

          } else if (
            question.lastAttemptCorrect ===
              false
          ) {

            feedback.textContent =
              "✗ NOT QUITE. CHECK THE ORDER AND TRY AGAIN.";

          }


          card.appendChild(
            feedback
          );


          questionsContainer.appendChild(
            card
          );

        }
      );

    }


    function checkLevel4Question(
      questionIndex
    ) {

      const question =
        currentPractice.levels[4][
          questionIndex
        ];


      if (
        question.answered
      ) {

        return;

      }


      const currentOrder =
        question.currentOrder || [];


      const currentItems =
        currentOrder.map(
          function(itemId) {

            return question.shuffledItems.find(
              function(item) {
                return item.id === itemId;
              }
            );

          }
        );


      const isCorrect =
        currentItems.length ===
          question.items.length &&
        currentItems.every(
          function(item, index) {

            return (
              item &&
              item.originalIndex ===
              question.items[index].originalIndex
            );

          }
        );


      question.lastAttemptCorrect =
        isCorrect;


      question.correctAnswer =
        isCorrect;


      if (
        isCorrect
      ) {

        question.answered =
          true;

      }


      updateUnlockedLevel();

      renderPractice();

    }

    function renderPractice() {

      if (
        !currentPractice
      ) {

        return;

      }


      updateUnlockedLevel();


      const currentLevel =
        currentPractice.currentLevel;


      const questions =
        currentPractice.levels[
          currentLevel
        ];


      if (
        !questions ||
        questions.length === 0
      ) {

        return;

      }


      practiceArea.style.display =
        "block";


      scriptPreviewCard.classList.remove(
        "hidden"
      );


      scriptPreview.textContent =
        currentPractice.script;


      levelTitle.textContent =
        LEVELS[
          currentLevel
        ].title;


      levelInstructions.textContent =
        LEVELS[
          currentLevel
        ].instructions;


      questionsContainer.innerHTML =
        "";


      completionBox.classList.add(
        "hidden"
      );


      renderLevelNavigation();


      if (
        currentLevel === 1
      ) {

        renderLevel1(
          questions
        );

      } else if (
        currentLevel === 2
      ) {

        renderLevel2(
          questions
        );

      } else if (
        currentLevel === 3
      ) {

        renderLevel3(
          questions
        );

      } else if (
        currentLevel === 4
      ) {

        renderLevel4(
          questions
        );

      }


      updateProgress();


      if (
        isLevelComplete(
          currentLevel
        )
      ) {

        showLevelCompletion(
          currentLevel
        );

      }


      if (
        currentLevel < 4 &&
        currentPractice.unlockedLevel >
          currentLevel
      ) {

        nextLevelButton.classList.remove(
          "hidden"
        );

      } else {

        nextLevelButton.classList.add(
          "hidden"
        );

      }

    }

        answered +

        questions.length +

        correct +
        " / " +
        questions.length;
