<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stance Speak | Cultural Fair Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 25px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
      font-weight: normal;
      margin-top: 0;
    }

    .activities {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .activity {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .activity-icon {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .activity h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .activity p {
      color: #666;
      line-height: 1.5;
    }

    .activity button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>STANCE SPEAK</h1>
    <h2>Cultural Fair Practice</h2>
  </header>

  <main>

    <div class="activities">

      <div class="activity">
        <div class="activity-icon">🎧</div>

        <h3>Listen & Read</h3>

        <p>
          Listen to your script while following the words on the screen.
        </p>

        <a href="listen.html">
  <button>START</button>
</a>
      </div>

      <div class="activity">
        <div class="activity-icon">🧠</div>

        <h3>Practice Your Script</h3>

        <p>
          Practice saying your script and gradually use less help from the text.
        </p>

        <button>
          START
        </button>
      </div>

    </div>

  </main>

</body>
</html>
